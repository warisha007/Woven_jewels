<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e9ddc6">
    <meta name="description" content="Browse the Woven Jewels collection and open a piece to view its photos and details.">
    <title>All Collections — Woven Jewels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: light; --paper: #fffaf0; --ink: #3e2a17; --muted: #776447; --gold: #8a6536; --line: rgba(91,67,38,.22); --serif: "Playfair Display",Georgia,serif; --sans: "DM Sans","Segoe UI",sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: #e9ddc6; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      .site-header { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px max(16px, calc((100% - 940px) / 2)); background: rgba(255,250,240,.9); border-bottom: 1px solid var(--line); }
      .brand { display: inline-flex; align-items: center; gap: 8px; }
      .brand-symbol { display: block; width: 32px; height: 50px; flex: none; background: url("./woven-jewels-logo.jpeg") 50% 21% / 100px 100px no-repeat; mix-blend-mode: multiply; }
      .brand-wordmark { display: block; width: 190px; height: 42px; flex: none; background: url("./woven-jewels-logo.jpeg") center 80% / 100% auto no-repeat; mix-blend-mode: multiply; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
      .header-actions { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 12px; }
      .header-actions a:hover { color: var(--gold); }
      .bag-link { padding: 8px 12px; border: 1px solid var(--line); background: rgba(255,255,255,.55); color: var(--ink); }
      main { width: min(100%, 980px); margin: 0 auto; padding: 14px 20px 34px; }
      .collection-art { position: relative; width: min(100%, 940px); margin: 0 auto; line-height: 0; }
      .collection-art > img { display: block; width: 100%; height: auto; pointer-events: none; }
      .product-hotspot { position: absolute; z-index: 2; display: block; margin: 0; padding: 0; border: 0; border-radius: 12px; background: transparent; color: transparent; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
      .product-hotspot::after { position: absolute; inset: 0; border: 2px solid transparent; border-radius: inherit; content: ""; transition: background .16s ease, border-color .16s ease; }
      .product-hotspot:hover::after { border-color: rgba(255,250,240,.9); background: rgba(64,43,20,.12); }
      .product-hotspot:focus-visible { outline: 3px solid #fffaf0; outline-offset: 3px; }
      .product-hotspot:active::after { background: rgba(64,43,20,.22); }
      .status { min-height: 22px; margin: 12px auto 0; color: #694c2b; font-size: 12px; text-align: center; }
      .helper { margin: 6px auto 0; color: var(--muted); font-size: 11px; text-align: center; }
      .site-footer { padding: 18px 20px; border-top: 1px solid var(--line); background: rgba(255,250,240,.82); color: var(--muted); font-size: 11px; text-align: center; }
      @media (max-width: 600px) {
        main { padding: 8px 8px 24px; }
        .site-header { min-height: 52px; padding-inline: 12px; }
        .brand-symbol { width: 24px; height: 38px; background-size: 76px 76px; }
        .brand-wordmark { width: 140px; height: 31px; background-size: 140px auto; }
        .header-actions { gap: 9px; font-size: 10px; }
        .bag-link { padding: 7px 8px; }
        .product-hotspot { border-radius: 8px; }
      }
      @media (max-width: 380px) {
        .brand-symbol { width: 22px; height: 34px; background-size: 68px 68px; }
        .brand-wordmark { width: 115px; height: 26px; background-size: 115px auto; }
        .header-actions a:first-child { display: none; }
      }
      @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Woven Jewels home"><span class="brand-symbol" aria-hidden="true"></span><span class="brand-wordmark" aria-hidden="true"></span></a>
      <nav class="header-actions" aria-label="Collection navigation">
        <a href="./index.html">← Home</a>
        <a class="bag-link" id="bagLink" href="./order-summary.html">View order (<span id="bagCount">0</span>)</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Woven Jewels collection</h1>
      <section class="collection-art" aria-label="Shop the Woven Jewels collection">
        <img src="./collection-reference.png" alt="Woven Jewels collection featuring Ethereal Handchain, Moonlace bracelets, Rainbow bracelets, Joyful Bloom Bracelet, Starfall Earrings, Lilac Bracelet, Pearle Bracelet, Beaded Bracelets, and Blossom Bracelet">
        <a class="product-hotspot" href="./product-details.html?id=ethereal-handchain" style="left:14.5%;top:9.5%;width:21.5%;height:28%" aria-label="View details for Ethereal Handchain" title="View Ethereal Handchain details"></a>
        <a class="product-hotspot" href="./product-details.html?id=moonlace-bracelets" style="left:39%;top:9.5%;width:21.5%;height:28%" aria-label="View details for Moonlace bracelets" title="View Moonlace bracelets details"></a>
        <a class="product-hotspot" href="./product-details.html?id=rainbow-bracelets" style="left:63.8%;top:9.5%;width:21.5%;height:28%" aria-label="View details for Rainbow bracelets" title="View Rainbow bracelets details"></a>
        <a class="product-hotspot" href="./product-details.html?id=joyful-bloom-bracelet" style="left:14.5%;top:38.5%;width:21.5%;height:27.5%" aria-label="View details for Joyful Bloom Bracelet" title="View Joyful Bloom Bracelet details"></a>
        <a class="product-hotspot" href="./product-details.html?id=starfall-earrings" style="left:39%;top:38.5%;width:21.5%;height:27.5%" aria-label="View details for Starfall Earrings" title="View Starfall Earrings details"></a>
        <a class="product-hotspot" href="./product-details.html?id=lilac-bracelet" style="left:63.8%;top:38.5%;width:21.5%;height:27.5%" aria-label="View details for Lilac Bracelet" title="View Lilac Bracelet details"></a>
        <a class="product-hotspot" href="./product-details.html?id=pearle-bracelet" style="left:14.5%;top:67.5%;width:21.5%;height:28%" aria-label="View details for Pearle Bracelet" title="View Pearle Bracelet details"></a>
        <a class="product-hotspot" href="./product-details.html?id=beaded-bracelets" style="left:39%;top:67.5%;width:21.5%;height:28%" aria-label="View details for Beaded Bracelets (Set of 6)" title="View Beaded Bracelets details"></a>
        <a class="product-hotspot" href="./product-details.html?id=blossom-bracelet" style="left:63.8%;top:67.5%;width:21.5%;height:28%" aria-label="View details for Blossom Bracelet" title="View Blossom Bracelet details"></a>
      </section>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="helper">Select a product to view its details. Use “View order” when you’re ready.</p>
    </main>
    <footer class="site-footer">© <span id="year"></span> Woven Jewels · Handmade with care</footer>
    <script>
      const CART_KEY = "woven-jewels-cart";
      const bagCount = document.querySelector("#bagCount");

      function readCart() {
        const saved = localStorage.getItem(CART_KEY);
        if (!saved) return [];
        try {
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed) || parsed.some((item) =>
            !item || typeof item.id !== "string" || typeof item.name !== "string" ||
            !Number.isSafeInteger(item.price) || item.price < 0
          )) throw new Error("Saved cart data is invalid.");
          return parsed;
        } catch (error) {
          console.error("Could not read the saved Woven Jewels cart.", error);
          localStorage.removeItem(CART_KEY);
          return [];
        }
      }

      let cart = readCart();

      function updateBagCount() {
        bagCount.textContent = String(cart.length);
      }

      document.querySelector("#year").textContent = String(new Date().getFullYear());
      updateBagCount();
    </script>
  </body>
</html>
